name: 식단표 갱신

on:
  schedule:
    # 시간은 UTC 기준(한국시간 - 9시간). GitHub 사정으로 몇십 분 늦게 실행될 수 있음
    - cron: "0 0 * * 1-5"   # 평일 오전 9시(한국시간): 정기 갱신
    - cron: "0 1 * * 1-5"   # 평일 오전 10시(한국시간): 9시에 실패했을 때만 재실행
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능 (항상 실행)

permissions:
  contents: write      # docs/ 변경 내용을 커밋하기 위해

# 9시 실행이 늦어져 10시 실행과 겹치면 순서대로 실행
concurrency:
  group: update-menu
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 10시 실행: 오늘 이미 성공했으면 건너뜀
      - name: 오늘 갱신 성공 여부 확인
        id: check
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          if [ "${{ github.event.schedule }}" = "0 1 * * 1-5" ] \
             && [ -f docs/status.json ] \
             && grep -q "\"date\": \"$today\"" docs/status.json \
             && grep -q '"ok": true' docs/status.json; then
            echo "오늘 이미 갱신 성공 → 재실행 건너뜀"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - if: steps.check.outputs.skip != 'true'
        run: pip install requests

      - name: 식단 가져오기
        if: steps.check.outputs.skip != 'true'
        env:
          # 9시 실행이 실패하면 페이지에 "10시에 다시 시도합니다" 표시
          RETRY_LATER: ${{ github.event.schedule == '0 0 * * 1-5' && '1' || '0' }}
        run: python build_site.py

      # 실패해도(빨간 X) "갱신 실패" 표시가 들어간 페이지는 커밋해서 공개.
      # docs/를 커밋하면 GitHub Pages가 자동으로 새 페이지를 공개함.
      # 매일 커밋이 생겨서 "60일간 활동 없으면 예약 실행 중지" 규칙에도 걸리지 않음.
      - name: 변경 내용 커밋
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "식단표 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git pull --rebase
          git push
