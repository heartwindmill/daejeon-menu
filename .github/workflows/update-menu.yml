name: 식단표 갱신

on:
  schedule:
    # 평일 오전 7시(한국시간) = UTC 전날 22시. GitHub 사정으로 몇십 분 늦게 실행될 수 있음
    - cron: "0 22 * * 0-4"
  workflow_dispatch:   # Actions 탭에서 수동 실행 가능

permissions:
  contents: write      # docs/ 변경 내용을 커밋하기 위해

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - run: python build_site.py

      # docs/를 커밋하면 GitHub Pages가 자동으로 새 페이지를 공개함.
      # 매일 커밋이 생겨서 "60일간 활동 없으면 예약 실행 중지" 규칙에도 걸리지 않음.
      - name: 변경 내용 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "식단표 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
